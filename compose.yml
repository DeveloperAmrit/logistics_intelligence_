# Local stack. Every component is open source and pinned.
#
#   Apache Kafka 3.9 (KRaft, Apache-2.0)  - durable event log, no ZooKeeper
#   PostgreSQL 16    (PostgreSQL licence) - operational store
#   Kafka UI         (Apache-2.0)         - topic inspection during a demo
#
# The lakehouse is DuckDB + Parquet on the local filesystem, so there is no
# object-store service to run. See docs/adr/004-lakehouse-storage.md.

name: logistics-intelligence

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: lil-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093,INTERNAL://0.0.0.0:29092   # controller stays inside the container; 3.9 refuses to advertise 0.0.0.0
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092   # INTERNAL is for containers such as the Kafka UI
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168          # seven days, as designed
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: nJHzVc4hXpScV9zO6O1FNA             # must be a 22-character base64 UUID (kafka-storage format checks it)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16-alpine
    container_name: lil-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lil-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    profiles: ["full"]

volumes:
  kafka-data:
  pg-data:
